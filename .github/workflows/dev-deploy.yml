name: Commit to development branch | Code Linting

on:
  push:
    branches:
      - develop

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Run Linting Checks
        run: |
          ruff check src/
          black --check src/
          mypy src/

  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to DEV
        run: |
          ./scripts/deploy_dev.sh
